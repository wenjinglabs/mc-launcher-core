# 重型验证走夜间定时：push 工作流只保留秒级门禁 + 分钟级库构建。
# M2 起第 3/4 层测试（插桩 smoke、E2E 日志断言）也挂在这里。
name: nightly

on:
  schedule:
    # UTC 19:00 = 北京时间 03:00
    - cron: "0 19 * * *"
  workflow_dispatch:

jobs:
  app-baseline:
    name: "ZalithLauncher app builds (baseline intact)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - uses: android-actions/setup-android@v3
      - name: Install NDK pinned by baseline
        run: sdkmanager --install "ndk;25.2.9519653" >/dev/null
      - name: Assemble app
        run: ./gradlew :ZalithLauncher:assembleDebug
