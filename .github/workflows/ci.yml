name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  purity-gate:
    name: ":launchcore UI-free gate"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Gate
        run: bash scripts/gate_core_purity.sh

  launchcore:
    name: ":launchcore build + unit tests"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Build & test
        run: ./gradlew :launchcore:assembleRelease :launchcore:test

  # 重型验证（app 基线回归、M2 起的 E2E smoke）见 nightly.yml，push 不等待它们

